<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030b17">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>J.A.R.V.I.S.</title>
<style>
:root{--bg:#030b17;--panel:#071a2e;--line:#0e3a5c;--cy:#22d3ee;--cy2:#67e8f9;--tx:#d8f6ff;--dim:#6b9bb3}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali",system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:radial-gradient(circle at 50% 18%,#0a2a4a 0,var(--bg) 60%)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
h1{font-size:15px;letter-spacing:.3em;color:var(--cy);font-weight:600}
select,button{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.hud{position:relative;height:190px;display:grid;place-items:center;flex:none}
.ring{position:absolute;border-radius:50%;border:1px solid var(--cy);opacity:.5}
.r1{width:150px;height:150px;border-style:dashed;animation:spin 18s linear infinite}
.r2{width:110px;height:110px;border-color:var(--cy2);border-top-color:transparent;animation:spin 6s linear infinite reverse}
.core{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#cffafe,var(--cy) 55%,#0e7490);box-shadow:0 0 30px var(--cy);transition:transform .3s}
.listening .core{animation:pulse .7s ease-in-out infinite alternate}
.thinking .r2{animation-duration:1.2s}
.speaking .core{animation:pulse .35s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{to{transform:scale(1.25)}}
#status{text-align:center;color:var(--dim);font-size:13px;min-height:18px}
#log{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 12px;border-radius:12px;line-height:1.5;font-size:15px;white-space:pre-wrap;border:1px solid var(--line)}
.u{align-self:flex-end;background:#0a2c48}
.j{align-self:flex-start;background:var(--panel);border-color:#155e75}
form{display:flex;gap:8px;padding:10px 12px 14px}
input{flex:1;min-width:0;font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px 14px}
input:focus,button:focus-visible,select:focus-visible{outline:2px solid var(--cy)}
#mic{width:48px;height:48px;border-radius:50%;padding:0;font-size:20px;border-color:var(--cy);touch-action:none;user-select:none}
#mic.on{background:var(--cy);color:#001018}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><h1>J.A.R.V.I.S.</h1>
<span><select id="lang" aria-label="Language"><option value="bn">বাংলা</option><option value="en">English</option></select>
<button id="clear" type="button">Clear</button></span></header>
<div class="hud" id="hud"><div class="ring r1"></div><div class="ring r2"></div><div class="core"></div></div>
<div id="status">Hold the mic and speak, or type below.</div>
<div id="log" aria-live="polite"></div>
<form id="f"><button id="mic" type="button" aria-label="Hold to talk">🎤</button>
<input id="q" placeholder="Message Jarvis…" autocomplete="off"><button>Send</button></form>
<script>
const $=id=>document.getElementById(id),log=$('log'),hud=$('hud'),st=$('status');
const LOC={bn:'bn-BD',en:'en-US'};
let hist=[];try{hist=JSON.parse(localStorage.getItem('jarvis_h')||'[]')}catch(e){}
$('lang').value=(()=>{try{return localStorage.getItem('jarvis_l')||'bn'}catch(e){return'bn'}})();
const save=()=>{try{localStorage.setItem('jarvis_h',JSON.stringify(hist.slice(-40)))}catch(e){}};
const state=(s,t)=>{hud.className='hud '+s;st.textContent=t||''};
function add(role,text){const d=document.createElement('div');d.className='m '+(role==='user'?'u':'j');d.textContent=text;log.append(d);log.scrollTop=log.scrollHeight}
hist.forEach(m=>add(m.role,m.text));
$('lang').onchange=e=>{try{localStorage.setItem('jarvis_l',e.target.value)}catch(_){}};
$('clear').onclick=()=>{hist=[];save();log.innerHTML=''};
function speak(t){
  if(!('speechSynthesis' in window))return state('', '');
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[*_`#>]/g,'')),l=LOC[$('lang').value];
  u.lang=l;const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith(l.slice(0,2)));if(v)u.voice=v;
  u.onstart=()=>state('speaking','Speaking…');u.onend=u.onerror=()=>state('','');
  speechSynthesis.speak(u);
}
async function send(text){
  text=text.trim();if(!text)return;
  hist.push({role:'user',text});add('user',text);save();state('thinking','Thinking…');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist.slice(-20),lang:$('lang').value})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);
    hist.push({role:'model',text:d.reply});add('model',d.reply);save();speak(d.reply);
  }catch(e){add('model','Couldn’t reach the server: '+e.message);state('','Check that /api/chat is deployed and GEMINI_API_KEY is set.')}
}
$('f').onsubmit=e=>{e.preventDefault();const v=$('q').value;$('q').value='';send(v)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$('mic');let rec,heard='';
if(!SR){mic.disabled=true;st.textContent='Voice input isn’t supported in this browser. Use Chrome on Android.'}
else{
  mic.onpointerdown=e=>{e.preventDefault();speechSynthesis.cancel();heard='';rec=new SR();rec.lang=LOC[$('lang').value];rec.interimResults=true;
    rec.onresult=ev=>{heard=[...ev.results].map(r=>r[0].transcript).join('');st.textContent=heard};
    rec.onerror=ev=>state('','Mic error: '+ev.error);
    rec.onend=()=>{mic.classList.remove('on');if(heard)send(heard);else state('','')};
    try{rec.start();mic.classList.add('on');state('listening','Listening…')}catch(_){}};
  const stop=()=>{try{rec&&rec.stop()}catch(_){}};mic.onpointerup=stop;mic.onpointercancel=stop;
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
